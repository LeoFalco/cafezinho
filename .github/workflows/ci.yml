name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Swift version
        run: swift --version

      - name: Test
        run: ./test.sh

      - name: Build universal app
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then export VERSION="${GITHUB_REF_NAME#v}"; fi
          UNIVERSAL=1 ./build.sh zip
          lipo -info build/Cafezinho.app/Contents/MacOS/Cafezinho
          codesign --verify --verbose build/Cafezinho.app

      - uses: actions/upload-artifact@v7
        with:
          name: Cafezinho
          path: build/Cafezinho.zip

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Cafezinho

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Cafezinho.zip --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
